zerombr
clearpart --all --initlabel
autopart

lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
user --name=ix1 --groups=wheel --password=ix1

bootc --source-imgref=registry:10.0.2.2:5000/ix1-os:dev --target-imgref=10.0.2.2:5000/ix1-os:dev

%post
# Anaconda boots container installs to multi-user.target unless the
# installer environment advertises a graphical login service; ix1's
# desktop session requires graphical.target.
systemctl set-default graphical.target
# Anaconda's bootc payload path does not create the user's home directory;
# without it the graphical session fails immediately (exit 3).
install -d -m 0700 -o ix1 -g ix1 /home/ix1
%end

reboot
