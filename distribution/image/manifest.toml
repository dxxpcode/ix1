# bootc-image-builder manifest for the ix1 dev qcow2 disk image.
# Uses the builder's default Fedora bootc partition layout
# (ESP + /boot + /) — keep customizations minimal for now.
# Used by scripts/build-disk-image.sh — do not hand-edit outputs.

[customizations]
hostname = "ix1"

[[customizations.user]]
name = "ix1"
groups = ["wheel"]
# Note: BIB does not apply user `password`/`key` to bootc qcow2 images —
# the account ships locked. Local verification injects credentials into
# the built disk via qemu-nbd (see scripts/qemu-creds.sh).
