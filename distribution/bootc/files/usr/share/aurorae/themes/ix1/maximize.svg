<?xml version="1.0" encoding="UTF-8"?>
<!-- Traffic-light maximize/zoom button: green dot, chevron glyph on hover. -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="12" viewBox="0 0 80 12">
  <g id="active-center">
    <circle cx="6" cy="6" r="6" fill="#28C840"/>
    <circle cx="6" cy="6" r="6" fill="none" stroke="#1B8A2E" stroke-opacity="0.6" stroke-width="0.75"/>
  </g>
  <g id="hover-center" transform="translate(16,0)">
    <circle cx="6" cy="6" r="6" fill="#28C840"/>
    <circle cx="6" cy="6" r="6" fill="none" stroke="#1B8A2E" stroke-opacity="0.6" stroke-width="0.75"/>
    <path d="M4.4,3.4 L6.6,6 L4.4,8.6 M7.6,3.4 L5.4,6 L7.6,8.6" stroke="#0B4A1B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g id="pressed-center" transform="translate(32,0)">
    <circle cx="6" cy="6" r="6" fill="#1FA636"/>
    <path d="M4.4,3.4 L6.6,6 L4.4,8.6 M7.6,3.4 L5.4,6 L7.6,8.6" stroke="#0B3A17" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g id="inactive-center" transform="translate(48,0)">
    <circle cx="6" cy="6" r="6" fill="#4A4E57"/>
    <circle cx="6" cy="6" r="6" fill="none" stroke="#3A3E46" stroke-width="0.75"/>
  </g>
  <g id="deactivated-center" transform="translate(64,0)">
    <circle cx="6" cy="6" r="6" fill="#4A4E57" fill-opacity="0.6"/>
  </g>
</svg>
