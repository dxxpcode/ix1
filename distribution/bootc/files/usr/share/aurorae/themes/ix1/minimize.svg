<?xml version="1.0" encoding="UTF-8"?>
<!-- Traffic-light minimize button: amber dot, minus glyph on hover. -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="12" viewBox="0 0 80 12">
  <g id="active-center">
    <circle cx="6" cy="6" r="6" fill="#FFBD2E"/>
    <circle cx="6" cy="6" r="6" fill="none" stroke="#C08A00" stroke-opacity="0.6" stroke-width="0.75"/>
  </g>
  <g id="hover-center" transform="translate(16,0)">
    <circle cx="6" cy="6" r="6" fill="#FFBD2E"/>
    <circle cx="6" cy="6" r="6" fill="none" stroke="#C08A00" stroke-opacity="0.6" stroke-width="0.75"/>
    <path d="M3.6,6 L8.4,6" stroke="#6B4A00" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <g id="pressed-center" transform="translate(32,0)">
    <circle cx="6" cy="6" r="6" fill="#DDA021"/>
    <path d="M3.6,6 L8.4,6" stroke="#59400A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <g id="inactive-center" transform="translate(48,0)">
    <circle cx="6" cy="6" r="6" fill="#4A4E57"/>
    <circle cx="6" cy="6" r="6" fill="none" stroke="#3A3E46" stroke-width="0.75"/>
  </g>
  <g id="deactivated-center" transform="translate(64,0)">
    <circle cx="6" cy="6" r="6" fill="#4A4E57" fill-opacity="0.6"/>
  </g>
</svg>
