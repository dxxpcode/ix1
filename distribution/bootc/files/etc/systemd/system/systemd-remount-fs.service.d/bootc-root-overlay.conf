# On bootc the deployment root is an overlay (composefs) over the btrfs
# subvol. systemd-remount-fs tries to apply the fstab options for / with a
# plain remount, which the kernel rejects ("overlay: No changes allowed in
# reconfigure") and the unit fails, leaving every boot 'degraded'. The
# initrd already mounts the deployment root read-only, so this remount is a
# no-op for us. Rather than tolerating every remount failure, only swallow
# the exit status while / is an overlay — a failure anywhere else still
# fails the unit.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/lib/systemd/systemd-remount-fs || { s=$?; findmnt -n -o FSTYPE / | grep -qx overlay || exit $s; }'
