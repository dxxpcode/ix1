<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var t;
  try { t = localStorage.getItem("ix1-theme"); } catch (e) {}
  t = t ||
    (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  if (t === "dark") document.documentElement.classList.add("dark");
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ix1 — a desktop that just works</title>
<meta name="description" content="ix1 is a minimal, atomic Linux desktop. Signed image-based updates, instant rollback, Flatpak apps.">
<link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
